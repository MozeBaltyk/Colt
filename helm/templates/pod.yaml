{{- if eq .Values.deployAs "Pod" }}
# Pod kind on purpose for `podman play kube`: a Deployment is flattened to a
# pod and renamed (`toolkit` -> `toolkit-pod`), which breaks `--replace`/`--down`
# lifecycle matching. Keep a Pod here so podman manages it by the stable name
# `toolkit`. For a real K8s cluster, set `deployAs: Deployment` (deployment.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: toolkit
  labels:
    app.kubernetes.io/name: toolkit
spec:
  {{- include "toolkit.podspec" . | nindent 2 }}
{{- end }}
