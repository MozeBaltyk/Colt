name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - uses: azure/setup-helm@v5
      - run: just test
      - run: go vet ./...
      - run: go test -race ./internal/... ./tests/bdd/... -count=1
      - run: just test-bdd-blackbox

  gitea-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Colt to Gitea vertical scenario
        env:
          CONTAINER_TOOL: docker
        run: go test -tags integration ./integration/ -run '^TestGiteaVerticalSlice$' -count=1 -timeout 12m

  forgejo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Colt to Forgejo vertical scenario
        env:
          CONTAINER_TOOL: docker
        run: go test -tags integration ./integration/ -run '^TestForgejoVerticalSlice$' -count=1 -timeout 12m
